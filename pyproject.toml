[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonanoshape"
version = "0.1.0"
description = "Thin API wrapper around AutoNanoShape scripts"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AutoNanoShape" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy",
  "pandas",
  "networkx",
]

[project.optional-dependencies]
data = [
  "torch",
  "nff @ git+https://github.com/learningmatter-mit/NeuralForceField.git",
]
train = [
  "torch",
  "nff @ git+https://github.com/learningmatter-mit/NeuralForceField.git",
  "matplotlib",
]
predict = [
  "torch",
  "nff @ git+https://github.com/learningmatter-mit/NeuralForceField.git",
  "ase",
]

[project.urls]
Homepage = "https://github.com/<OWNER>/AutoNanoShape"

[tool.setuptools.packages.find]
where = ["."]
include = ["autonanoshape*"]
